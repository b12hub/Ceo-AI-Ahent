version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ceo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceo_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: ceo_agent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: n8n_automations
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Tashkent
    volumes:
      - n8n_data:/home/node/.n8n

  fastapi_bot:
    build: .
    container_name: ceo_fastapi_bot
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
  n8n_data: